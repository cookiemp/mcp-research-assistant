<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskMyDocs - MCP research assistant</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --panel-2: #1d2330;
    --line: #2a3242;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --accent: #7aa2ff;
    --ok: #4ade80;
    --err: #f87171;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 20% -10%, #1a2233 0%, var(--bg) 55%);
    color: var(--text);
    font: 17px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 20px 80px;
  }
  main { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 26px; }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -0.02em; }
  .sub { margin: 0; color: var(--muted); }
  .badges { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 12.5px; letter-spacing: .02em; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
    background: rgba(255,255,255,.02);
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
  }
  form { display: grid; gap: 12px; }
  label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  textarea {
    width: 100%; resize: vertical; min-height: 92px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font: inherit;
  }
  textarea:focus { outline: 2px solid rgba(122,162,255,.35); border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #0b1020; border: 0; border-radius: 9px;
    padding: 10px 18px; font: inherit; font-weight: 650; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: progress; }
  .status { color: var(--muted); font-size: 14px; }
  .status.busy::before {
    content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 8px;
    border: 2px solid rgba(122,162,255,.3); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .example {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 500;
  }
  .example:hover:not(:disabled) { color: var(--text); border-color: #3d4a63; }
  section { margin-top: 22px; }
  h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }
  ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .step {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--line); border-radius: 9px; padding: 10px 13px;
    font-size: 14.5px;
  }
  .step.tool_call { border-left-color: var(--accent); }
  .step.ok { border-left-color: var(--ok); }
  .step.err { border-left-color: var(--err); }
  .step.notice { border-left-color: #fbbf24; }
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  code { font-family: "Cascadia Code", Consolas, monospace; font-size: 13.5px; color: #c9d6ff; }
  .args { color: var(--muted); font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  .tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .step.ok .tag { color: var(--ok); border-color: rgba(74,222,128,.4); }
  .step.err .tag { color: var(--err); border-color: rgba(248,113,113,.4); }
  .step.notice .tag { color: #fbbf24; border-color: rgba(251,191,36,.4); }
  .body { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
  .answer {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px;
  }
  .answer.error { border-color: rgba(248,113,113,.5); }
  #answer-text { white-space: pre-wrap; margin: 0; font-size: 17.5px; }
  .meta { margin-top: 12px; color: var(--muted); font-size: 12.5px; font-family: "Cascadia Code", Consolas, monospace; }
  footer { margin-top: 34px; color: #667085; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AskMyDocs</h1>
    <p class="sub">Ask your notes and the live web. Every answer cites its sources.</p>
    <div class="badges">
      <span class="badge">MCP server &middot; stdio</span>
      <span class="badge">custom MCP client</span>
      <span class="badge">Gemini agent loop</span>
    </div>
  </header>

  <form id="form" class="card">
    <label for="question">Your question</label>
    <textarea id="question" placeholder="e.g. What do my notes say about MCP logging, and what is the current spec version?" autofocus></textarea>
    <div class="row">
      <button id="ask" type="submit">Ask</button>
      <span id="status" class="status" aria-live="polite"></span>
    </div>
    <div class="examples" id="examples">
      <button type="button" class="example" data-q="What does my oauth note say about authentication vs authorization? Cite the file.">OAuth notes</button>
      <button type="button" class="example" data-q="Summarize how MCP stdio servers should handle logging, then check the web for the current specification version. Cite every source.">Notes + web</button>
      <button type="button" class="example" data-q="List the project ideas in my notes and cite the file.">Project ideas</button>
    </div>
  </form>

  <section id="steps-box" hidden>
    <h2>MCP tool calls</h2>
    <ol id="steps" class="steps"></ol>
  </section>

  <section id="answer-box" hidden>
    <h2>Answer</h2>
    <div id="answer" class="answer">
      <pre id="answer-text"></pre>
      <div id="meta" class="meta"></div>
    </div>
  </section>

  <footer>Local demo &middot; no authentication &middot; binds to 127.0.0.1</footer>
</main>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const button = document.getElementById("ask");
  const statusEl = document.getElementById("status");
  const stepsBox = document.getElementById("steps-box");
  const stepList = document.getElementById("steps");
  const answerBox = document.getElementById("answer-box");
  const answerCard = document.getElementById("answer");
  const answerText = document.getElementById("answer-text");
  const meta = document.getElementById("meta");

  function setBusy(busy, message) {
    button.disabled = busy;
    input.disabled = busy;
    document.querySelectorAll(".example").forEach((b) => (b.disabled = busy));
    statusEl.classList.toggle("busy", busy);
    statusEl.textContent = message || "";
  }

  function renderSteps(steps) {
    const visible = (steps || []).filter((s) => s.kind !== "answer");
    stepList.replaceChildren();
    if (!visible.length) {
      stepsBox.hidden = true;
      return;
    }
    for (const step of visible) {
      const li = document.createElement("li");
      const isResult = step.kind === "tool_result";
      li.className = "step " + (isResult ? (step.is_error ? "err" : "ok") : step.kind);

      const head = document.createElement("div");
      head.className = "head";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent =
        step.kind === "tool_call" ? "call" : isResult ? (step.is_error ? "error" : "ok") : "note";
      head.append(tag);

      if (step.kind === "tool_call" || isResult) {
        const name = document.createElement("code");
        name.textContent = step.tool || "tool";
        head.append(name);
      }
      if (step.kind === "tool_call") {
        const args = document.createElement("span");
        args.className = "args";
        args.textContent = JSON.stringify(step.arguments || {});
        head.append(args);
      }
      li.append(head);

      if (step.kind !== "tool_call" && step.text) {
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = String(step.text).split("\n")[0].slice(0, 180);
        li.append(body);
      }
      stepList.append(li);
    }
    stepsBox.hidden = false;
  }

  function showAnswer(text, isError) {
    answerCard.classList.toggle("error", Boolean(isError));
    answerText.textContent = text;
    answerBox.hidden = false;
  }

  async function ask(question) {
    setBusy(true, "Asking the MCP server...");
    stepsBox.hidden = true;
    answerBox.hidden = true;
    meta.textContent = "";
    const started = performance.now();

    try {
      const response = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await response.json();
      renderSteps(data.steps);

      if (!response.ok) {
        showAnswer("Error: " + (data.error || "request failed"), true);
      } else {
        showAnswer(data.answer || "(the model returned no text)", false);
        const seconds = ((performance.now() - started) / 1000).toFixed(1);
        meta.textContent = (data.model ? data.model + " \u00b7 " : "") + seconds + "s";
      }
    } catch (error) {
      showAnswer("Network error: " + error, true);
    } finally {
      setBusy(false, "");
      input.focus();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (question) ask(question);
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  document.getElementById("examples").addEventListener("click", (event) => {
    const target = event.target.closest("button.example");
    if (!target || button.disabled) return;
    input.value = target.dataset.q;
    ask(input.value);
  });
</script>
</body>
</html>
